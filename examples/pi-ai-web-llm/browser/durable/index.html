<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Pi Durable + WebLLM</title>
  </head>
  <body>
    <main>
      <nav><a href="../">Agent Core example</a></nav>
      <h1>Pi Durable + WebLLM</h1>
      <p>
        Load a model to open its saved conversation. Reload and load it again to resume unfinished
        work.
      </p>
      <label
        >Model
        <select id="model">
          <option>Qwen3.5-4B-q4f16_1-MLC</option>
          <option>gemma-4-E2B-it-q4f16_1-MLC</option>
          <option>Qwen3-8B-q4f16_1-MLC</option>
          <option>Qwen2.5-3B-Instruct-q4f16_1-MLC</option>
        </select>
      </label>
      <button id="load">Load model and conversation</button>
      <p id="status">Load a model to start. Conversations are saved in this browser.</p>
      <form id="chat">
        <label
          >Message <input id="message" required value="Look up A7 and tell me the answer."
        /></label>
        <button id="send" type="submit" disabled>Send</button>
        <button type="button" id="cancel" disabled>Cancel</button>
      </form>
      <pre id="answer"></pre>
      <details>
        <summary>Saved conversation and running tasks</summary>
        <pre id="details"></pre>
      </details>
    </main>
    <script type="module" src="/src/durable.ts"></script>
  </body>
</html>
