name: CI

on:
  push:
  pull_request:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm check

  consumer-install:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manager: [yarn-pnp, yarn-node-modules, pnpm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          cache: true
          require-lockfile: true
      - run: pnpm test:install:manager ${{ matrix.manager }}

  runtime-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22.19.0
          cache: true
          require-lockfile: true
      - run: pnpm build:adapters
      - run: pnpm --filter pi-ai-web-llm test:install
      - run: pnpm --filter @web-llm-adapters/strands-harness test:install
      - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
        with:
          runtime: node@22.12.0
          install: false
      - run: pnpm --filter langchain-web-llm --filter strands-web-llm --workspace-concurrency=1 run test:install
        env:
          NODE_OPTIONS: --experimental-strip-types
