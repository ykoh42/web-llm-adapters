name: Publish

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Package release tag
        type: string
        required: true
      dry_run:
        description: Check without publishing
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: publish-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'ykoh42/web-llm-adapters' && !github.event.release.prerelease
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.event.release.tag_name || inputs.tag }}

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check release tag
        id: release
        run: |
          git merge-base --is-ancestor HEAD origin/main
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs'
          const match = /^([a-z][a-z0-9-]*)-v(\d+\.\d+\.\d+)$/.exec(process.env.RELEASE_TAG)
          if (!match) throw new Error('Use a stable package-v1.2.3 release tag.')
          const [, name, version] = match
          const manifest = JSON.parse(readFileSync(`packages/${name}/package.json`, 'utf8'))
          if (manifest.name !== name || manifest.version !== version || manifest.private)
            throw new Error('Release tag must match a public package and its version.')
          appendFileSync(process.env.GITHUB_OUTPUT, `package=${name}\n`)
          NODE
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:adapters
      - name: Check installed package
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: pnpm --filter "$PACKAGE" test:install
      - name: Check publish
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: pnpm --dir "packages/$PACKAGE" publish --dry-run --access public
      - name: Publish to npm
        if: github.event_name == 'release' || !inputs.dry_run
        env:
          PACKAGE: ${{ steps.release.outputs.package }}
        run: pnpm --filter "$PACKAGE" -r publish --access public --provenance
