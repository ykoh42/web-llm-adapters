name: Strands SDK compatibility

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - run: pnpm install --frozen-lockfile
      - name: Update to the latest compatible SDK
        run: pnpm --filter strands-web-llm update @strands-agents/sdk
      - run: pnpm --filter strands-web-llm typecheck
      - run: pnpm exec vitest run packages/strands-web-llm/test
